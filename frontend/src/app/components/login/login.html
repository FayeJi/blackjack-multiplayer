<p-toolbar styleClass="mb-4 shadow-1">
    <ng-template pTemplate="start">
        <div class="flex align-items-center gap-2">
            <i class="pi pi-th-large text-2xl text-primary"></i>
            <h2 class="m-0 font-bold">Online Casino Games</h2>
        </div>
    </ng-template>
</p-toolbar>

<div class="flex justify-content-center align-items-center min-h-screen">
    <p-card header="Login" styleClass="w-full max-w-25rem bg-surface-100">
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-column gap-4 mt-4">

            <!-- Username Field -->
            <p-floatLabel>
                <input pInputText id="username" formControlName="username" class="w-full" />
                <label for="username">Username</label>
            </p-floatLabel>

            <!-- Password Field -->
            <p-floatLabel class="mt-2">
                <p-password id="password" formControlName="password" [toggleMask]="true" styleClass="w-full"
                    inputStyleClass="w-full" [feedback]="false" />
                <label for="password">Password</label>
            </p-floatLabel>

            <!-- Error Message Display -->
            <div *ngIf="errorMessage" class="text-red-500 text-center">
                {{ errorMessage }}
            </div>

            <!-- Submit Button -->
            <p-button label="Log In" type="submit" [disabled]="loginForm.invalid" icon="pi pi-sign-in" iconPos="right"
                styleClass="w-full mt-2" />

            <p-divider align="center">
                <span>OR</span>
            </p-divider>

            <!-- Registration Link -->
            <div class="text-center">
                <span>Don't have an account? </span>
                <a routerLink="/register" class="font-medium no-underline text-primary cursor-pointer">Sign Up</a>
            </div>

        </form>
    </p-card>
</div>
